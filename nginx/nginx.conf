events {}

http {
  # Docker's internal DNS; upstreams are resolved per request so nginx starts
  # even when a container (e.g. grafana in the monitoring profile) isn't running
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;
    server_name 34.68.175.217;

    location /pms/ {
      set $api_gateway http://api-gateway:4004;
      rewrite ^/pms/(.*)$ /$1 break;
      proxy_pass $api_gateway;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
    }

    location /grafana/ {
      set $grafana http://grafana:3000;
      proxy_pass $grafana;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;

      # WebSocket support (needed for Grafana Live)
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}