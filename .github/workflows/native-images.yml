name: Build native images

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to build (comma-separated, or 'all')"
        default: all
  push:
    branches: [main, docker-optimised]
    paths:
      - "api-gateway/**"
      - "auth-service/**"
      - "analytics-service/**"
      - "appointment-service/**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # billing-service and patient-service stay on the JVM image (Dockerfile):
        # net.devh grpc-spring-boot-starter doesn't support GraalVM native images
        service:
          - api-gateway
          - auth-service
          - analytics-service
          - appointment-service
    steps:
      - name: Skip if not selected
        id: check
        run: |
          sel="${{ github.event.inputs.services || 'all' }}"
          if [ "$sel" = "all" ] || [[ ",${sel// /}," == *",${{ matrix.service }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'

      - uses: actions/setup-java@v4
        if: steps.check.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - uses: docker/login-action@v3
        if: steps.check.outputs.run == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build native image
        if: steps.check.outputs.run == 'true'
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B -Pnative spring-boot:build-image -DskipTests \
            -Dspring-boot.build-image.imageName=vk28122812/pms:${{ matrix.service }}

      - name: Push image
        if: steps.check.outputs.run == 'true'
        run: docker push vk28122812/pms:${{ matrix.service }}
